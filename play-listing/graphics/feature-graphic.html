<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Libre+Franklin:wght@800&family=Source+Serif+4:opsz,wght@8..60,400&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; background: #F7F3EA; }
  .wrap { display: flex; align-items: center; height: 500px; padding: 0 72px; box-sizing: border-box; gap: 56px; }
  img { width: 236px; height: 236px; border-radius: 52px; box-shadow: 0 10px 30px rgba(34,32,27,.18); }
  h1 { font-family: "Libre Franklin", sans-serif; font-weight: 800; font-size: 104px; line-height: 1; margin: 0 0 18px; color: #22201B; letter-spacing: -1px; }
  p { font-family: "Source Serif 4", serif; font-size: 34px; line-height: 1.25; margin: 0 0 22px; color: #22201B; max-width: 600px; }
  .rule { width: 64px; height: 5px; background: #4F6B2E; margin: 0 0 18px; }
  .mono { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 20px; color: #6E6759; letter-spacing: .5px; }
</style></head>
<body><div class="wrap">
  <img src=".icon-src.png" alt="">
  <div>
    <h1>HobPad</h1>
    <div class="rule"></div>
    <p>Photograph a recipe. One tap turns it into your shopping list.</p>
    <div class="mono">RECIPES · SHOPPING LISTS · NOTES · TODOS</div>
  </div>
</div></body></html>
